name: Extract
on: workflow_dispatch
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat kila-part-*.txt > KILA-source.zip
          unzip -q KILA-source.zip
          mv kila/.github/workflows/kila-android.yml kila/kila-android.yml.txt
          rm -rf kila/.github/workflows
          cp -a kila/. .
          rm -rf kila KILA-source.zip kila-part-*.txt
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "KILA source"
          git push
