name: Extract satu-satu
on:
  workflow_dispatch:
    inputs:
      zip:
        description: "Nama file zip, misal z1-mori.zip"
        required: true
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          ls -la
          unzip -o -q "${{ inputs.zip }}"
          rm -f "${{ inputs.zip }}"
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "extract ${{ inputs.zip }}"
          git push
